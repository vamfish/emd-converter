name: Build Windows EXE

# 手动触发：Actions -> Build Windows EXE -> Run workflow
# 或在推送 v* 标签时自动触发
on:
  workflow_dispatch:
    inputs:
      exe_name:
        description: '可执行文件名（不含 .exe）'
        required: false
        default: 'EMD_Converter'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file exe (onefile, windowed)
        shell: pwsh
        run: |
          $exeName = "${{ inputs.exe_name }}"
          if ([string]::IsNullOrEmpty($exeName)) { $exeName = 'EMD_Converter' }
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name $exeName `
            --collect-all h5py `
            --collect-all tifffile `
            emd_converter_gui.py

      - name: Smoke test (import + instantiate analyzer on schema-only check)
        shell: pwsh
        run: |
          # 仅验证 exe 能启动 GUI 主程序（无显示器环境下无法开窗，这里跳过 GUI；
          # 依赖完整性由 PyInstaller 构建日志保证）。列出产物大小即可。
          Get-Item dist/*.exe | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error