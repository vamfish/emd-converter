name: Build Windows EXE

# 手动触发：Actions -> Build Windows EXE -> Run workflow（仅构建 exe，不发布）
# 推送 v* 标签：测试通过 -> 构建 -> 自动创建 GitHub Release
#   （release notes 提取自 CHANGELOG.md 中对应的版本块）
on:
  workflow_dispatch:
    inputs:
      exe_name:
        description: '可执行文件名（不含 .exe）'
        required: false
        default: 'EMD_Converter'
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: pytest (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -q

  build:
    name: PyInstaller (Windows)
    runs-on: windows-latest
    needs: test
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file exe (onefile, windowed)
        shell: pwsh
        run: |
          $exeName = "${{ inputs.exe_name }}"
          if ([string]::IsNullOrEmpty($exeName)) { $exeName = 'EMD_Converter' }
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name $exeName `
            --collect-all h5py `
            --collect-all tifffile `
            emd_converter_gui.py

      - name: List artifact
        shell: pwsh
        run: |
          Get-Item dist/*.exe | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4

      - name: Extract changelog section for this version
        id: changelog
        shell: python
        run: |
          import re
          tag = "${{ github.ref_name }}"          # 例如 v0.1.3
          expect = f"## [{tag}]"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # 版本块写作 [v0.1.3] 或 [0.1.3] 均可（^ 行首 + 整行片段，避免命中说明文字）
          pat = re.compile(rf"^## \[\s*v?\s*{re.escape(tag.lstrip('v'))}\s*\]", re.M)
          if pat.search(text):
              start = pat.search(text).start()
          elif expect in text:
              start = text.index(expect)
          else:
              raise SystemExit(f"CHANGELOG.md 中未找到版本块 {expect}，请先补充")
          end = text.find("\n## [", start + 3)
          if end == -1:
              end = len(text)
          body = text[start:end].strip() + "\n\n---\n\nCI 自动构建于 " + "${{ github.server_url }}" + \
                 "/" + "${{ github.repository }}" + "/actions"
          open("release_body.md", "w", encoding="utf-8").write(body)

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EMD_Converter ${{ github.ref_name }}
          body_path: release_body.md
          files: dist/*.exe
          fail_on_unmatched_files: true